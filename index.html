<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet & Collide — Skip the small talk</title>
<meta name="description" content="Discover what you have in common before you meet. Two AI-generated persona cards collide to surface shared interests, mental models, and conversation starters.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='5' y='5' width='43.5' height='43.5' rx='1.5' fill='%231a7a6d'/><rect x='51.5' y='5' width='43.5' height='43.5' rx='1.5' fill='%233d1f47'/><rect x='5' y='51.5' width='43.5' height='43.5' rx='1.5' fill='%233d1f47'/><path d='M51.5 95 Q51.5 51.5 95 51.5 L95 95 Z' fill='%23d4416b'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--nav-h:44px;--teal:#1a7a6d;--teal-dark:#0f5c52;--purple:#5a3068;--purple-deep:#3d1f47;--accent:#d4416b;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'DM Mono',monospace;--ease:cubic-bezier(.22,1,.36,1)}
[data-theme="dark"]{--bg:#050505;--bg-2:#0a0a0f;--surface:rgba(255,255,255,.035);--surface-2:rgba(255,255,255,.02);--border:rgba(255,255,255,.07);--border-md:rgba(255,255,255,.12);--text-1:rgba(255,255,255,.95);--text-2:rgba(255,255,255,.65);--text-3:rgba(255,255,255,.4);--text-meta:rgba(255,255,255,.22);--text-ghost:rgba(255,255,255,.07);--card-hover:rgba(255,255,255,.05);--src-a-bg:rgba(26,122,109,.12);--src-a-text:var(--teal);--src-b-bg:rgba(90,48,104,.15);--src-b-text:rgba(180,140,210,.7);--nav-bg:rgba(5,5,5,.92);--glow-a:rgba(26,122,109,.04);--glow-b:rgba(90,48,104,.04)}
[data-theme="light"]{--bg:#F5F5F7;--bg-2:#fff;--surface:rgba(0,0,0,.03);--surface-2:rgba(0,0,0,.015);--border:rgba(0,0,0,.08);--border-md:rgba(0,0,0,.13);--text-1:rgba(0,0,0,.88);--text-2:rgba(0,0,0,.55);--text-3:rgba(0,0,0,.38);--text-meta:rgba(0,0,0,.2);--text-ghost:rgba(0,0,0,.06);--card-hover:rgba(0,0,0,.04);--src-a-bg:rgba(26,122,109,.1);--src-a-text:#0f5c52;--src-b-bg:rgba(90,48,104,.08);--src-b-text:#5a3068;--nav-bg:rgba(255,255,255,.92);--glow-a:rgba(26,122,109,.06);--glow-b:rgba(90,48,104,.06)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-body);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;transition:background .4s var(--ease),color .4s var(--ease)}
::selection{background:var(--teal);color:#fff}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--text-ghost);border-radius:2px}

/* ── NAV ── */
#nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:200;display:flex;align-items:center;padding:0 20px;gap:10px;background:var(--nav-bg);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid var(--border);transition:background .4s var(--ease)}
.nav-mark{display:flex;align-items:center;gap:7px;flex-shrink:0}
.wordmark{font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--text-1);letter-spacing:-.01em}.wordmark .hi{font-weight:300;color:var(--accent)}
.nav-spacer{flex:1}
.toggle-pill{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;flex-shrink:0}
.toggle-pill button{font-family:var(--font-mono);font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;color:var(--text-meta);padding:3px 9px;cursor:pointer;transition:all .2s var(--ease)}
.toggle-pill button.on{color:var(--text-2);font-weight:400}
.nav-link{font-family:var(--font-mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-meta);text-decoration:none;padding:3px 6px;transition:color .2s;cursor:pointer}.nav-link:hover{color:var(--text-1)}

/* ── APP LAYOUT ── */
#app{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - var(--nav-h));margin-top:var(--nav-h);overflow:hidden}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

/* ── LEFT PANEL ── */
#left{border-right:1px solid var(--border);overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column;gap:0;background:var(--bg);position:relative}
@media(max-width:800px){#left{border-right:none;border-bottom:1px solid var(--border);max-height:40vh}}
.glow{position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(100px);pointer-events:none;opacity:.6}
.glow.a{background:var(--glow-a);top:-40px;left:-60px}
.glow.b{background:var(--glow-b);bottom:-40px;right:-60px}

.brand-block{position:relative;z-index:1;margin-bottom:20px}
.brand-tagline{font-family:var(--font-display);font-size:22px;font-weight:300;letter-spacing:-.03em;line-height:1.25;color:var(--text-1);margin-bottom:6px}
.brand-tagline .dim{color:var(--text-3)}
.brand-sub{font-size:12px;color:var(--text-3);line-height:1.55;font-weight:300}

/* Steps */
.steps{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;margin-bottom:20px}
.step{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:8px 0}
.step-n{font-family:var(--font-display);font-size:18px;font-weight:300;color:var(--text-ghost);line-height:1}
.step-body{}
.step-t{font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--text-1);letter-spacing:-.01em;margin-bottom:2px}
.step-d{font-size:10.5px;color:var(--text-3);line-height:1.45}

/* Prompt action */
.prompt-action{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:16px;transition:border-color .3s var(--ease)}
.prompt-action:hover{border-color:var(--border-md)}
.pa-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pa-icon{width:18px;height:18px;border-radius:3px;background:rgba(212,65,107,.12);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--accent)}
.pa-title{font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--text-1)}
.pa-desc{font-size:10px;color:var(--text-3);line-height:1.45;margin-bottom:10px}
.pa-buttons{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{font-family:var(--font-mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:3px;cursor:pointer;transition:all .25s var(--ease);border:1px solid var(--border);background:none;color:var(--text-2)}
.btn-sm:hover{border-color:var(--teal);color:var(--teal)}
.btn-sm.active{background:rgba(212,65,107,.1);border-color:rgba(212,65,107,.3);color:var(--accent)}
.btn-sm.copied{background:rgba(26,122,109,.12);border-color:var(--teal);color:var(--teal)}

/* Saved */
.saved-block{position:relative;z-index:1;margin-top:auto;padding-top:12px}
.saved-label{font-family:var(--font-mono);font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-meta);margin-bottom:6px}
.saved-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;cursor:pointer;transition:background .15s;font-size:10px;color:var(--text-2)}
.saved-item:hover{background:var(--card-hover);color:var(--text-1)}
.saved-item .sn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-item .sd{font-family:var(--font-mono);font-size:7.5px;color:var(--text-meta)}
.saved-item .sx{background:none;border:none;color:var(--text-meta);cursor:pointer;font-size:12px;padding:0 3px;border-radius:2px;line-height:1;transition:color .2s}.saved-item .sx:hover{color:var(--accent)}

/* Footer note */
.left-footer{font-family:var(--font-mono);font-size:7.5px;color:var(--text-meta);letter-spacing:.04em;padding-top:10px;border-top:1px solid var(--border);margin-top:10px;text-align:center}

/* ── RIGHT PANEL (main workspace) ── */
#right{overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:20px;background:var(--bg-2);transition:background .4s var(--ease)}
@media(max-width:800px){#right{padding:16px}}

.input-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
@media(max-width:600px){.input-row{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}

.in-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .3s var(--ease);min-height:180px}
.in-card:hover{border-color:var(--border-md)}
.in-card.ok{border-color:rgba(26,122,109,.2)}
.in-card.ok .in-dot.a{box-shadow:0 0 8px rgba(26,122,109,.3)}
.in-card.ok .in-dot.b{box-shadow:0 0 8px rgba(90,48,104,.3)}
.in-head{padding:12px 16px 6px;display:flex;align-items:center;gap:7px}
.in-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0;transition:box-shadow .3s}.in-dot.a{background:var(--teal)}.in-dot.b{background:var(--purple)}
.in-label{font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-meta)}
.in-name{font-family:var(--font-display);font-size:11px;color:var(--text-2);margin-left:auto;opacity:0;transition:opacity .3s}
.in-card.ok .in-name{opacity:1}
.in-area{flex:1;width:100%;background:transparent;border:none;color:var(--text-1);font-family:var(--font-mono);font-size:9.5px;line-height:1.5;padding:4px 16px 8px;resize:none;outline:none;letter-spacing:.01em}
.in-area::placeholder{color:var(--text-ghost)}.in-area:focus{background:var(--card-hover)}
.in-foot{padding:0 16px 8px;display:flex;align-items:center;gap:8px}
.in-status{font-family:var(--font-mono);font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;flex:1}
.in-status.valid{color:var(--teal)}.in-status.invalid{color:var(--accent)}

/* Bottom bar */
.action-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.btn-collide{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--text-ghost);border:1px solid var(--text-ghost);padding:12px 28px;border-radius:4px;cursor:default;pointer-events:none;transition:all .5s var(--ease)}
.btn-collide.ready{color:#fff;background:var(--accent);border-color:var(--accent);cursor:pointer;pointer-events:all;box-shadow:0 0 20px rgba(212,65,107,.15)}
.btn-collide.ready:hover{filter:brightness(1.15);transform:translateY(-1px)}
.action-hint{font-family:var(--font-mono);font-size:8px;color:var(--text-meta);letter-spacing:.04em}
.action-demo{font-family:var(--font-mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-meta);cursor:pointer;transition:color .3s;margin-left:auto;padding:4px 0;border-bottom:1px solid var(--border)}
.action-demo:hover{color:var(--teal)}
</style>
</head>
<body>

<nav id="nav">
  <div class="nav-mark">
    <svg viewBox="0 0 100 100" width="14" height="14"><rect x="5" y="5" width="43.5" height="43.5" rx="1.5" fill="#1a7a6d"/><rect x="51.5" y="5" width="43.5" height="43.5" rx="1.5" fill="#3d1f47"/><rect x="5" y="51.5" width="43.5" height="43.5" rx="1.5" fill="#3d1f47"/><path d="M51.5 95 Q51.5 51.5 95 51.5 L95 95 Z" fill="#d4416b"/></svg>
    <span class="wordmark">meet & collide<span class="hi">.ai</span></span>
  </div>
  <span class="nav-spacer"></span>
  <div class="toggle-pill" id="lang-toggle">
    <button class="on" onclick="setLang('en')">EN</button>
    <button onclick="setLang('de')">DE</button>
  </div>
  <div class="toggle-pill" id="theme-toggle">
    <button onclick="setTheme('light')">☀</button>
    <button class="on" onclick="setTheme('dark')">☾</button>
  </div>
</nav>

<div id="app">
  <!-- ── LEFT: explanation + prompt + saved ── -->
  <div id="left">
    <div class="glow a"></div>
    <div class="glow b"></div>

    <div class="brand-block">
      <div class="brand-tagline" id="brand-tagline"></div>
      <div class="brand-sub" data-i="brand_sub"></div>
    </div>

    <div class="steps">
      <div class="step"><span class="step-n">1</span><div class="step-body"><div class="step-t" data-i="s1_t"></div><div class="step-d" data-i="s1_d"></div></div></div>
      <div class="step"><span class="step-n">2</span><div class="step-body"><div class="step-t" data-i="s2_t"></div><div class="step-d" data-i="s2_d"></div></div></div>
      <div class="step"><span class="step-n">3</span><div class="step-body"><div class="step-t" data-i="s3_t"></div><div class="step-d" data-i="s3_d"></div></div></div>
    </div>

    <div class="prompt-action">
      <div class="pa-head">
        <div class="pa-icon">⚡</div>
        <div class="pa-title" data-i="pa_title"></div>
      </div>
      <div class="pa-desc" data-i="pa_desc"></div>
      <div class="pa-buttons">
        <button class="btn-sm active" id="btn-copy-en" onclick="copyPrompt('en')">Copy EN prompt</button>
        <button class="btn-sm" id="btn-copy-de" onclick="copyPrompt('de')">Copy DE prompt</button>
      </div>
    </div>

    <div class="saved-block" id="saved-block" style="display:none">
      <div class="saved-label" data-i="saved_label"></div>
      <div id="saved-list"></div>
    </div>

    <div class="left-footer">100% client-side · no data leaves your browser · bridge-work.ai</div>
  </div>

  <!-- ── RIGHT: paste cards + collide ── -->
  <div id="right">
    <div class="input-row">
      <div class="in-card" id="card-a">
        <div class="in-head"><span class="in-dot a"></span><span class="in-label">Person A</span><span class="in-name" id="name-a"></span></div>
        <textarea class="in-area" id="json-a" spellcheck="false"></textarea>
        <div class="in-foot"><span class="in-status" id="status-a"></span></div>
      </div>
      <div class="in-card" id="card-b">
        <div class="in-head"><span class="in-dot b"></span><span class="in-label">Person B</span><span class="in-name" id="name-b"></span></div>
        <textarea class="in-area" id="json-b" spellcheck="false"></textarea>
        <div class="in-foot"><span class="in-status" id="status-b"></span></div>
      </div>
    </div>
    <div class="action-bar">
      <button class="btn-collide" id="btn-collide" onclick="runCollision()" data-i="collide_btn"></button>
      <span class="action-hint" id="action-hint"></span>
      <span class="action-demo" onclick="loadDemo()" data-i="demo_link"></span>
    </div>
  </div>
</div>

<script>
'use strict';

/* ══ i18n ══ */
const I={
en:{
  brand_tagline:'Discover what connects you<br><span class="dim">before you even meet.</span>',
  brand_sub:'Two people each generate a collision card with their AI. Paste both here. The engine surfaces shared interests, mental models, and conversation starters.',
  s1_t:'Generate your card',s1_d:'Copy the prompt below, paste it into any AI (Claude, ChatGPT, Gemini). It builds your collision card in ~5 minutes.',
  s2_t:'Share & collect',s2_d:'Send the same prompt to the person you\'re meeting. They generate their own card.',
  s3_t:'Collide',s3_d:'Paste both JSONs on the right. The engine opens an interactive collision map in a new tab.',
  pa_title:'Get the persona builder prompt',
  pa_desc:'Copy the system prompt and paste it as the first message in any AI. If your AI already knows you, it drafts the card instantly — you just review and add your meeting intent.',
  saved_label:'Saved collisions',
  collide_btn:'Collide →',hint_wait:'Paste both cards',hint_ready:'Ready to collide',
  demo_link:'Load demo',
  placeholder:'Paste collision card JSON here...'
},
de:{
  brand_tagline:'Entdecke, was euch verbindet<br><span class="dim">bevor ihr euch trefft.</span>',
  brand_sub:'Zwei Personen generieren je eine Collision Card mit ihrer KI. Beide hier einfügen. Die Engine zeigt gemeinsame Interessen, Denkmodelle und Gesprächseinstiege.',
  s1_t:'Card generieren',s1_d:'Prompt unten kopieren, in eine beliebige KI einfügen (Claude, ChatGPT, Gemini). Baut deine Card in ~5 Minuten.',
  s2_t:'Teilen & sammeln',s2_d:'Den gleichen Prompt an die Person schicken, die du triffst. Sie generiert ihre eigene Card.',
  s3_t:'Kollidieren',s3_d:'Beide JSONs rechts einfügen. Die Engine öffnet eine interaktive Kollisionskarte im neuen Tab.',
  pa_title:'Persona Builder Prompt holen',
  pa_desc:'System Prompt kopieren und als erste Nachricht in eine KI einfügen. Wenn deine KI dich schon kennt, baut sie die Card sofort — du reviewst nur und ergänzt den Meeting-Intent.',
  saved_label:'Gespeicherte Kollisionen',
  collide_btn:'Kollidieren →',hint_wait:'Beide Cards einfügen',hint_ready:'Bereit',
  demo_link:'Demo laden',
  placeholder:'Collision Card JSON einfügen...'
}};

let lang='en';
function t(k){return I[lang]?.[k]||I.en[k]||k}
function setLang(l){
  lang=l;localStorage.setItem('mc-lang',l);
  document.querySelectorAll('#lang-toggle button').forEach(b=>b.classList.toggle('on',b.textContent.trim()===l.toUpperCase()));
  document.documentElement.lang=l;applyI18n();
}
function applyI18n(){
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;const v=t(k);if(v)el.innerHTML=v});
  document.getElementById('brand-tagline').innerHTML=t('brand_tagline');
  document.getElementById('json-a').placeholder=t('placeholder');
  document.getElementById('json-b').placeholder=t('placeholder');
  document.getElementById('action-hint').textContent=cardA&&cardB?t('hint_ready'):t('hint_wait');
  // Update copy button labels
  document.getElementById('btn-copy-en').textContent=lang==='de'?'EN Prompt kopieren':'Copy EN prompt';
  document.getElementById('btn-copy-de').textContent=lang==='de'?'DE Prompt kopieren':'Copy DE prompt';
}

function setTheme(th){
  document.documentElement.setAttribute('data-theme',th);localStorage.setItem('mc-theme',th);
  document.querySelectorAll('#theme-toggle button').forEach((b,i)=>b.classList.toggle('on',i===(th==='light'?0:1)));
}

/* ══ Prompt copy ══ */
const promptCache={};
function copyPrompt(l){
  const file=l==='de'?'prompts/persona-builder-DE.md':'prompts/persona-builder-EN.md';
  const btn=document.getElementById('btn-copy-'+l);
  function doCopy(text){
    // Extract system prompt block between ``` markers
    const m=text.match(/```\n([\s\S]*?)\n```/);
    const prompt=m?m[1].trim():text;
    navigator.clipboard.writeText(prompt).then(()=>{
      const orig=btn.textContent;
      btn.textContent=lang==='de'?'✓ Kopiert!':'✓ Copied!';
      btn.classList.add('copied');
      setTimeout(()=>{btn.textContent=orig;btn.classList.remove('copied')},2000);
    });
  }
  if(promptCache[l]){doCopy(promptCache[l]);return}
  fetch(file).then(r=>{if(!r.ok)throw new Error();return r.text()}).then(txt=>{promptCache[l]=txt;doCopy(txt)}).catch(()=>{
    btn.textContent='File not found';setTimeout(()=>applyI18n(),1500);
  });
}

/* ══ Validation ══ */
let cardA=null,cardB=null;
function validate(json,id){
  const s=document.getElementById('status-'+id),n=document.getElementById('name-'+id),c=document.getElementById('card-'+id);
  if(!json.trim()){s.textContent='';s.className='in-status';n.textContent='';c.classList.remove('ok');return null}
  try{const d=JSON.parse(json);if(!d.identity?.name)throw new Error('Missing identity.name');s.textContent='✓ '+d.identity.name;s.className='in-status valid';n.textContent=d.identity.name.split(' ')[0];c.classList.add('ok');return d}
  catch(e){s.textContent=e.message.substring(0,40);s.className='in-status invalid';n.textContent='';c.classList.remove('ok');return null}
}
document.getElementById('json-a').addEventListener('input',function(){cardA=validate(this.value,'a');updBtn()});
document.getElementById('json-b').addEventListener('input',function(){cardB=validate(this.value,'b');updBtn()});
function updBtn(){
  const b=document.getElementById('btn-collide'),h=document.getElementById('action-hint');
  if(cardA&&cardB){b.classList.add('ready');h.textContent=t('hint_ready');h.style.color='var(--teal)'}
  else{b.classList.remove('ready');h.textContent=t('hint_wait');h.style.color=''}
}

/* ══ Collision ══ */
function runCollision(){
  if(!cardA||!cardB)return;
  const id='mc-'+Date.now();
  const record={id,cardA,cardB,date:new Date().toISOString(),nameA:cardA.identity.name,nameB:cardB.identity.name,lang};
  const saved=JSON.parse(localStorage.getItem('mc-saved')||'[]');
  saved.unshift(record);if(saved.length>20)saved.length=20;
  localStorage.setItem('mc-saved',JSON.stringify(saved));
  localStorage.setItem('mc-current',JSON.stringify(record));
  renderSaved();
  window.open('collide.html','_blank');
}

/* ══ Saved ══ */
function renderSaved(){
  const saved=JSON.parse(localStorage.getItem('mc-saved')||'[]');
  const block=document.getElementById('saved-block'),list=document.getElementById('saved-list');
  if(!saved.length){block.style.display='none';return}
  block.style.display='block';
  list.innerHTML=saved.map(s=>{
    const d=new Date(s.date);
    const ds=d.toLocaleDateString(lang==='de'?'de-CH':'en-US',{day:'numeric',month:'short'});
    return`<div class="saved-item" onclick="openSaved('${s.id}')"><span class="sn">${s.nameA.split(' ')[0]} × ${s.nameB.split(' ')[0]}</span><span class="sd">${ds}</span><button class="sx" onclick="event.stopPropagation();delSaved('${s.id}')" title="×">×</button></div>`
  }).join('');
}
function openSaved(id){const saved=JSON.parse(localStorage.getItem('mc-saved')||'[]');const r=saved.find(s=>s.id===id);if(r){localStorage.setItem('mc-current',JSON.stringify(r));window.open('collide.html','_blank')}}
function delSaved(id){let saved=JSON.parse(localStorage.getItem('mc-saved')||'[]');saved=saved.filter(s=>s.id!==id);localStorage.setItem('mc-saved',JSON.stringify(saved));renderSaved()}

/* ══ Demo ══ */
function loadDemo(){
  fetch('demo-a.json').then(r=>r.ok?r.text():Promise.reject()).then(t=>{document.getElementById('json-a').value=t;cardA=validate(t,'a');updBtn()}).catch(()=>{});
  fetch('demo-b.json').then(r=>r.ok?r.text():Promise.reject()).then(t=>{document.getElementById('json-b').value=t;cardB=validate(t,'b');updBtn()}).catch(()=>{});
}

/* ══ Init ══ */
const sL=localStorage.getItem('mc-lang');if(sL)setLang(sL);else applyI18n();
const sT=localStorage.getItem('mc-theme');if(sT)setTheme(sT);
renderSaved();
</script>
